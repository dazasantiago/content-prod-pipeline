<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Style Test — {{THEME_LABEL}}</title>
    {{FONT_LINKS}}
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: {{BG}};
        --bg-alt: {{BG_ALT}};
        --ink: {{INK}};
        --ink-soft: {{INK_SOFT}};
        --accent: {{ACCENT}};
        --accent-deep: {{ACCENT_DEEP}};
        --font-display: {{FONT_DISPLAY}};
        --font-display-weight: {{FONT_DISPLAY_WEIGHT}};
        --font-body: {{FONT_BODY}};
        --radius: {{RADIUS}};
        --border: {{BORDER}};
        --card-shadow: {{CARD_SHADOW}};
        --glow-core: {{GLOW_CORE}};
        --glow-opacity: {{GLOW_OPACITY}};
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); font-family: var(--font-body); color: var(--ink); }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
      .clip { position: absolute; inset: 0; }
      .scene { display: flex; align-items: center; padding: 0 140px; }

      #bg-decor { {{BG_PATTERN_CSS}} }
      .glow-core {
        position: absolute; left: 360px; top: -60px; width: 1200px; height: 1200px;
        background: radial-gradient(circle, var(--glow-core) 0%, transparent 65%);
        opacity: var(--glow-opacity);
      }

      .label {
        font-family: var(--font-body); font-size: 16px; font-weight: 600;
        letter-spacing: 0.22em; text-transform: uppercase; color: var(--accent);
        margin: 0 0 18px 0;
      }
      .display {
        font-family: var(--font-display); font-weight: var(--font-display-weight);
        line-height: 1.05; margin: 0; color: var(--ink);
      }
      .accent-word { color: var(--accent); }
      .accent-underline {
        height: 6px; margin-top: 22px;
        background: linear-gradient(90deg, var(--accent), var(--accent-deep));
        border-radius: var(--radius);
      }
      .body-text { font-size: 26px; line-height: 1.5; color: var(--ink-soft); max-width: 620px; }

      /* Scene 1 — title */
      #scene-title .title-block { max-width: 1100px; }
      #scene-title .display { font-size: 104px; }
      #scene-title .accent-underline { width: 420px; }

      /* Scene 2 — stat */
      #scene-stat .stat-block { margin: 0 auto; text-align: center; position: relative; }
      #scene-stat .stat-ring {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -55%);
        width: 460px; height: 460px; border-radius: 50%; border: 2px solid var(--accent);
        opacity: 0.35;
      }
      .stat-number {
        font-family: var(--font-display); font-weight: var(--font-display-weight);
        font-size: 220px; line-height: 1; color: var(--ink); position: relative;
      }
      .stat-sub { font-size: 24px; color: var(--ink-soft); margin-top: 14px; }

      /* Scene 3 — cutaway */
      #scene-cutaway .cutaway-block { display: flex; align-items: center; gap: 100px; width: 100%; }
      .photo-card {
        width: 480px; height: 480px; border-radius: var(--radius); border: var(--border);
        box-shadow: var(--card-shadow); background: var(--bg-alt);
        display: flex; align-items: center; justify-content: center; position: relative; flex: none;
      }
      .avatar-silhouette { width: 220px; height: 220px; fill: var(--ink-soft); }
      .icon-badge {
        position: absolute; left: 50%; top: 40px; transform: translateX(-50%);
        width: 92px; height: 92px; border-radius: 50%; background: var(--accent);
        display: flex; align-items: center; justify-content: center; box-shadow: var(--card-shadow);
      }
      .icon-badge svg { width: 44px; height: 44px; fill: #fff; }
      .cutaway-caption { max-width: 560px; }

      /* Scene 4 — list */
      #scene-list .list-block { width: 100%; max-width: 1000px; margin: 0 auto; }
      .list-row {
        display: flex; align-items: baseline; gap: 28px; padding: 20px 0;
        border-bottom: 1px solid var(--ink-soft);
      }
      .list-index { font-family: var(--font-display); font-weight: var(--font-display-weight); font-size: 34px; color: var(--accent); }
      .list-text { font-family: var(--font-display); font-weight: 500; font-size: 44px; color: var(--ink); }

      /* Scene 5 — close */
      #scene-close .close-block { width: 100%; max-width: 1100px; margin: 0 auto; }
      .progress-track {
        width: 100%; height: 14px; border-radius: var(--radius); border: var(--border);
        background: var(--bg-alt); overflow: hidden; position: relative; margin-bottom: 16px;
      }
      .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent-deep)); }
      .progress-label { font-size: 22px; color: var(--ink-soft); margin-bottom: 40px; }
      #scene-close .display { font-size: 96px; }
      #scene-close .accent-underline { width: 360px; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-width="1920"
      data-height="1080"
      data-start="0"
      data-duration="26.2"
    >
      <div id="bg-decor" class="clip" data-start="0" data-duration="26.2" data-track-index="0">
        <div class="glow-core"></div>
      </div>

      <section id="scene-title" class="clip scene" data-start="0" data-duration="4.6" data-track-index="1">
        <div class="title-block">
          <div class="label" id="t-label">frame.md — comparación de estilo</div>
          <h1 class="display">
            <div id="t-line1">Un solo <span class="accent-word">acento</span>.</div>
            <div id="t-line2">Un fondo constante.</div>
          </h1>
          <div class="accent-underline" id="t-underline"></div>
        </div>
      </section>

      <section id="scene-stat" class="clip scene" data-start="4.6" data-duration="5.4" data-track-index="1">
        <div class="stat-block">
          <div class="stat-ring" id="s-ring"></div>
          <div class="label" id="s-label">automatizado</div>
          <div class="stat-number" id="s-number">0%</div>
          <div class="stat-sub" id="s-sub">recursos + tomas + montaje, sin tu cara</div>
        </div>
      </section>

      <section id="scene-cutaway" class="clip scene" data-start="10.0" data-duration="6.2" data-track-index="1">
        <div class="cutaway-block">
          <div class="photo-card" id="c-card">
            <svg class="avatar-silhouette" viewBox="0 0 100 100">
              <circle cx="50" cy="36" r="20" />
              <path d="M15 95 C15 65 30 55 50 55 C70 55 85 65 85 95 Z" />
            </svg>
            <div class="icon-badge" id="c-badge">
              <svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z" /></svg>
            </div>
          </div>
          <div class="cutaway-caption" id="c-caption">
            <div class="label">GEN-1 · cutaway</div>
            <div class="body-text">Un ícono aterriza sobre el sujeto — el mismo patrón del ejemplo real de GEN-1.</div>
          </div>
        </div>
      </section>

      <section id="scene-list" class="clip scene" data-start="16.2" data-duration="6.0" data-track-index="1">
        <div class="list-block">
          <div class="label" id="l-label">pipeline</div>
          <div class="list-row" data-i="1"><span class="list-index">01</span><span class="list-text">Recursos</span></div>
          <div class="list-row" data-i="2"><span class="list-index">02</span><span class="list-text">Tomas</span></div>
          <div class="list-row" data-i="3"><span class="list-index">03</span><span class="list-text">Montaje</span></div>
        </div>
      </section>

      <section id="scene-close" class="clip scene" data-start="22.2" data-duration="4.0" data-track-index="1">
        <div class="close-block">
          <div class="progress-track" id="p-track"><div class="progress-fill" id="p-fill"></div></div>
          <div class="progress-label" id="p-label">0%</div>
          <h2 class="display" id="close-line">Tu estilo. <span class="accent-word">Cada vez.</span></h2>
          <div class="accent-underline" id="close-underline"></div>
        </div>
      </section>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });

      // persistent background — slow breathing glow
      tl.to(".glow-core", { scale: 1.1, duration: 6, ease: "sine.inOut", repeat: -1, yoyo: true }, 0);

      // Scene 1 — title
      tl.from("#t-label", { y: 16, opacity: 0, duration: 0.5, ease: "power2.out" }, 0.15);
      tl.from("#t-line1", { y: 36, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.45);
      tl.from("#t-line2", { y: 36, opacity: 0, duration: 0.6, ease: "power3.out" }, 0.75);
      tl.fromTo("#t-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 1.35);

      // Scene 2 — stat
      tl.from("#s-label", { y: 16, opacity: 0, duration: 0.5 }, 4.75);
      tl.fromTo("#s-ring", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.6)" }, 4.95);
      {
        const counter = { val: 0 };
        tl.to(counter, {
          val: 87, duration: 1.4, ease: "power1.out",
          onUpdate: () => { document.getElementById("s-number").textContent = Math.round(counter.val) + "%"; },
        }, 5.15);
      }
      tl.from("#s-sub", { y: 12, opacity: 0, duration: 0.5 }, 5.3);

      // Scene 3 — cutaway
      tl.from("#c-card", { y: 24, opacity: 0, duration: 0.6, ease: "power3.out" }, 10.15);
      tl.fromTo("#c-badge", { y: -220, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power2.in" }, 10.55);
      tl.to("#c-badge", { scale: 1.15, duration: 0.12, ease: "power1.out" }, 11.1);
      tl.to("#c-badge", { scale: 1, duration: 0.25, ease: "elastic.out(1, 0.4)" }, 11.22);
      tl.from("#c-caption", { y: 16, opacity: 0, duration: 0.5 }, 11.5);

      // Scene 4 — list
      tl.from("#l-label", { y: 16, opacity: 0, duration: 0.5 }, 16.35);
      tl.from("[data-i='1']", { x: -32, opacity: 0, duration: 0.5, ease: "power3.out" }, 16.55);
      tl.from("[data-i='2']", { x: -32, opacity: 0, duration: 0.5, ease: "power3.out" }, 16.9);
      tl.from("[data-i='3']", { x: -32, opacity: 0, duration: 0.5, ease: "power3.out" }, 17.25);

      // Scene 5 — close
      tl.from("#p-track", { opacity: 0, duration: 0.4 }, 22.35);
      tl.to("#p-fill", { width: "100%", duration: 2.2, ease: "power1.inOut" }, 22.5);
      {
        const counter2 = { val: 0 };
        tl.to(counter2, {
          val: 100, duration: 2.2, ease: "power1.inOut",
          onUpdate: () => { document.getElementById("p-label").textContent = Math.round(counter2.val) + "%"; },
        }, 22.5);
      }
      tl.from("#close-line", { y: 28, opacity: 0, duration: 0.6, ease: "power3.out" }, 24.9);
      tl.fromTo("#close-underline", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out", transformOrigin: "left center" }, 25.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
